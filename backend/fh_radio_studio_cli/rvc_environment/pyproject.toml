[project]
name = "fh-audio-studio-rvc"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1", "librosa==0.10.2.post1", "numba==0.60.0",
  "fairseq @ https://github.com/BlueAmulet/fairseq-win-whl/releases/download/ci_build/fairseq-0.12.2-cp310-cp310-win_amd64.whl ; sys_platform == 'win32'",
  "fairseq==0.12.2 ; sys_platform != 'win32'",
  "faiss-cpu==1.7.4", "soundfile==0.13.1", "ffmpeg-python==0.2.0",
  "praat-parselmouth==0.4.6", "pyworld==0.3.5", "torchcrepe==0.0.23",
  "torchfcpe==0.0.4", "av==12.3.0", "python-dotenv==1.1.1",
]
[project.optional-dependencies]
torch-cpu = ["torch==2.7.1", "torchaudio==2.7.1"]
torch-cu128 = ["torch==2.7.1", "torchaudio==2.7.1"]
[tool.uv]
conflicts = [[{ extra = "torch-cpu" }, { extra = "torch-cu128" }]]
override-dependencies = ["omegaconf==2.3.0", "hydra-core==1.3.2"]
[tool.uv.extra-build-dependencies]
fairseq = ["setuptools<70", "wheel", "Cython<3", "numpy==1.26.4"]
[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = [{index = "torch-cpu", extra = "torch-cpu"}, {index = "torch-cu128", extra = "torch-cu128"}]
torchaudio = [{index = "torch-cpu", extra = "torch-cpu"}, {index = "torch-cu128", extra = "torch-cu128"}]
[build-system]
requires = ["setuptools<70", "wheel", "Cython<3", "numpy==1.26.4"]
build-backend = "setuptools.build_meta"
